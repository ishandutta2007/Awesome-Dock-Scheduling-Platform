<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Glowing Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    
    .subtitle-text {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #cbd5e1;
    }

    .badge-text {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      font-weight: 700;
      font-size: 13px;
      fill: #a5b4fc;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    /* Dynamic Animated Background Elements */
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
      100% { opacity: 0.3; transform: scale(1); }
    }

    @keyframes scanLine {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { opacity: 0.8; }
      100% { transform: translateY(320px); opacity: 0.2; }
    }

    @keyframes moveTruck {
      0% { transform: translateX(0px); }
      100% { transform: translateX(450px); }
    }

    @keyframes doorLight {
      0%, 100% { fill: #10b981; }
      50% { fill: #f59e0b; }
    }

    .pulse-element {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: center;
    }

    .scanner {
      animation: scanLine 4s ease-in-out infinite alternate;
    }

    .truck-motion {
      animation: moveTruck 12s linear infinite;
    }

    .door-indicator {
      animation: doorLight 3s infinite;
    }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)"/>

  <!-- Background Decorative Grid Lines -->
  <g opacity="0.1" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Ambient Dynamic Glowing Orbs in Background (Non-blocking) -->
  <circle cx="150" cy="100" r="180" fill="#6366f1" opacity="0.15" class="pulse-element"/>
  <circle cx="1050" cy="300" r="220" fill="#ec4899" opacity="0.12" class="pulse-element"/>
  <circle cx="900" cy="90" r="140" fill="#06b6d4" opacity="0.15" class="pulse-element"/>

  <!-- Animated Dock Doors Graphics (Right Side Background Accent) -->
  <g transform="translate(820, 90)" opacity="0.85">
    <!-- Dock Door 1 -->
    <rect x="0" y="0" width="70" height="110" rx="6" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <line x1="0" y1="25" x2="70" y2="25" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="50" x2="70" y2="50" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="75" x2="70" y2="75" stroke="#334155" stroke-width="2"/>
    <circle cx="35" cy="12" r="5" class="door-indicator"/>

    <!-- Dock Door 2 -->
    <rect x="90" y="0" width="70" height="110" rx="6" fill="#1e293b" stroke="#6366f1" stroke-width="3"/>
    <line x1="90" y1="25" x2="160" y2="25" stroke="#334155" stroke-width="2"/>
    <line x1="90" y1="50" x2="160" y2="50" stroke="#334155" stroke-width="2"/>
    <line x1="90" y1="75" x2="160" y2="75" stroke="#334155" stroke-width="2"/>
    <circle cx="125" cy="12" r="5" fill="#10b981"/>

    <!-- Dock Door 3 -->
    <rect x="180" y="0" width="70" height="110" rx="6" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <line x1="180" y1="25" x2="250" y2="25" stroke="#334155" stroke-width="2"/>
    <line x1="180" y1="50" x2="250" y2="50" stroke="#334155" stroke-width="2"/>
    <line x1="180" y1="75" x2="250" y2="75" stroke="#334155" stroke-width="2"/>
    <circle cx="215" cy="12" r="5" fill="#ef4444"/>
  </g>

  <!-- Foreground Main Text & Badge Card Container -->
  <g transform="translate(60, 50)" filter="url(#shadow)">
    <!-- Top Category Pill Badge -->
    <rect x="0" y="0" width="340" height="34" rx="17" fill="url(#cyanGrad)" opacity="0.2"/>
    <rect x="0" y="0" width="340" height="34" rx="17" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="170" y="22" text-anchor="middle" class="badge-text">🚚 Warehouse &amp; Yard Logistics</text>

    <!-- Main Title -->
    <text x="0" y="105" class="title-text">
      Awesome Dock Scheduling Platform
    </text>
    
    <!-- Title Underline Accent Bar -->
    <rect x="0" y="122" width="580" height="5" rx="2.5" fill="url(#accentGrad)"/>

    <!-- Subtitle Descriptions -->
    <text x="0" y="165" class="subtitle-text">
      A curated ecosystem of enterprise SaaS solutions &amp; open-source projects
    </text>
    <text x="0" y="195" class="subtitle-text">
      for warehouse dock appointment booking, gate check-in &amp; yard visibility.
    </text>

    <!-- Feature Feature Tag Badges -->
    <g transform="translate(0, 230)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="160" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="80" y="23" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#38bdf8">⏱️ Slot Booking</text>

      <!-- Tag 2 -->
      <rect x="175" y="0" width="180" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="265" y="23" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#a7f3d0">🚛 Yard Visibility</text>

      <!-- Tag 3 -->
      <rect x="370" y="0" width="190" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="465" y="23" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#fef08a">🤖 Driver Check-In</text>
    </g>
  </g>

  <!-- Bottom Accent Border Strip -->
  <rect x="0" y="392" width="1200" height="8" fill="url(#accentGrad)"/>
</svg>
