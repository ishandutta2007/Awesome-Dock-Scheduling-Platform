<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="cyanGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><filter id="shadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="10" flood-color="#000" flood-opacity=".5" stdDeviation="15"/></filter><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.7;transform:scale(1.08)}}@keyframes scanLine{0%{transform:translateY(0);opacity:.2}50%{opacity:.8}}@keyframes moveTruck{0%{transform:translateX(0)}}@keyframes doorLight{0%{fill:#10b981}50%{fill:#f59e0b}}.badge-text,.subtitle-text,.title-text{font-family:&apos;Segoe UI&apos;,system-ui,-apple-system,Roboto,sans-serif}.title-text{font-weight:800;font-size:46px;fill:#fff;letter-spacing:-.5px}.subtitle-text{font-weight:500;font-size:19px;fill:#cbd5e1}.badge-text{font-weight:700;font-size:13px;fill:#a5b4fc;text-transform:uppercase;letter-spacing:1.5px}.pulse-element{animation:pulseGlow 6s ease-in-out infinite;transform-origin:center}.door-indicator{animation:doorLight 3s infinite}</style><rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/><g stroke="#94a3b8" stroke-width="1" opacity=".1"><line x1="0" x2="1200" y1="80" y2="80"/><line x1="0" x2="1200" y1="160" y2="160"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="320" y2="320"/><line x1="200" x2="200" y1="0" y2="400"/><line x1="400" x2="400" y1="0" y2="400"/><line x1="600" x2="600" y1="0" y2="400"/><line x1="800" x2="800" y1="0" y2="400"/><line x1="1000" x2="1000" y1="0" y2="400"/></g><circle cx="150" cy="100" r="180" fill="#6366f1" class="pulse-element" opacity=".15"/><circle cx="1050" cy="300" r="220" fill="#ec4899" class="pulse-element" opacity=".12"/><circle cx="900" cy="90" r="140" fill="#06b6d4" class="pulse-element" opacity=".15"/><g opacity=".85" transform="translate(820, 90)"><rect width="70" height="110" x="0" y="0" fill="#1e293b" stroke="#475569" stroke-width="3" rx="6"/><line x1="0" x2="70" y1="25" y2="25" stroke="#334155" stroke-width="2"/><line x1="0" x2="70" y1="50" y2="50" stroke="#334155" stroke-width="2"/><line x1="0" x2="70" y1="75" y2="75" stroke="#334155" stroke-width="2"/><circle cx="35" cy="12" r="5" class="door-indicator"/><rect width="70" height="110" x="90" y="0" fill="#1e293b" stroke="#6366f1" stroke-width="3" rx="6"/><line x1="90" x2="160" y1="25" y2="25" stroke="#334155" stroke-width="2"/><line x1="90" x2="160" y1="50" y2="50" stroke="#334155" stroke-width="2"/><line x1="90" x2="160" y1="75" y2="75" stroke="#334155" stroke-width="2"/><circle cx="125" cy="12" r="5" fill="#10b981"/><rect width="70" height="110" x="180" y="0" fill="#1e293b" stroke="#475569" stroke-width="3" rx="6"/><line x1="180" x2="250" y1="25" y2="25" stroke="#334155" stroke-width="2"/><line x1="180" x2="250" y1="50" y2="50" stroke="#334155" stroke-width="2"/><line x1="180" x2="250" y1="75" y2="75" stroke="#334155" stroke-width="2"/><circle cx="215" cy="12" r="5" fill="#ef4444"/></g><g filter="url(#shadow)" transform="translate(60, 50)"><rect width="340" height="34" x="0" y="0" fill="url(#cyanGrad)" opacity=".2" rx="17"/><rect width="340" height="34" x="0" y="0" fill="none" stroke="#06b6d4" stroke-width="1.5" rx="17"/><text x="170" y="22" class="badge-text" text-anchor="middle">🚚 Warehouse &amp; Yard Logistics</text><text x="0" y="105" class="title-text">Awesome Dock Scheduling Platform</text><rect width="580" height="5" x="0" y="122" fill="url(#accentGrad)" rx="2.5"/><text x="0" y="165" class="subtitle-text">A curated ecosystem of enterprise SaaS solutions &amp; open-source projects</text><text x="0" y="195" class="subtitle-text">for warehouse dock appointment booking, gate check-in &amp; yard visibility.</text><g transform="translate(0, 230)"><rect width="160" height="36" x="0" y="0" fill="#1e293b" stroke="#475569" stroke-width="1" rx="8"/><text x="80" y="23" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" text-anchor="middle">⏱️ Slot Booking</text><rect width="180" height="36" x="175" y="0" fill="#1e293b" stroke="#475569" stroke-width="1" rx="8"/><text x="265" y="23" fill="#a7f3d0" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" text-anchor="middle">🚛 Yard Visibility</text><rect width="190" height="36" x="370" y="0" fill="#1e293b" stroke="#475569" stroke-width="1" rx="8"/><text x="465" y="23" fill="#fef08a" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" text-anchor="middle">🤖 Driver Check-In</text></g></g><rect width="1200" height="8" x="0" y="392" fill="url(#accentGrad)"/></svg>